<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Gestão de Documentos - Banco SENAI</title>
    <link rel="stylesheet" href="documentos.css">
</head>
<body>
    <h1>Gestão de Documentos</h1>

    <!-- Área de Envio de Arquivo -->
    <div class="form-container">
        <input type="number" id="codigoCliente" placeholder="Código do Cliente">
        <input type="file" id="arquivo">
        <button id="btnEnviar" onclick="enviarDocumento()">Enviar</button>
    </div>

    <!-- Área de Busca -->
    <div class="form-container">
        <input type="number" id="codigoClienteBusca" placeholder="Código do Cliente para buscar">
        <button id="btnBuscar" onclick="listarDocumentos()">Buscar Documentos</button>
    </div>

    <!-- Tabela de Dados -->
    <table id="tabelaDocumentos">
        <thead>
            <tr>
                <th>Id</th>
                <th>Nome</th>
                <th>Extensão</th>
                <th>Ações</th>
            </tr>
        </thead>
        <tbody id="corpoTabela">
            <!-- Dados carregados via JS -->
        </tbody>
    </table>

    <script src="documentos.js"></script>
</body>
</html>
